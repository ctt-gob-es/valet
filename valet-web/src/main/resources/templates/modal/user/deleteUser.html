<div class="modal fade" tabindex="-1" role="dialog" id="modalDeleteUser" data-backdrop="static" data-keyboard="false">
   <div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-header">
				<h4 class="modal-title" th:text="#{form.user.delete.title}"></h4>
				<button type="button" class="close" data-dismiss="modal" aria-label="#{form.user.close}">
					<span aria-hidden="true">&times;</span>
				</button>
			</div>
			<div class="modal-body">
				<div class="modal-pre">
					<p th:text="#{valet.message.confirmDelete}"></p>
				</div>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-default" th:text="#{form.user.close}" onclick="closeModalDeleteUser('modalDeleteUser')"></button>
				<button type="button" id="idDeleteUserBtn" name="idDeleteUserBtn" class="btn btn-danger" th:text="#{form.user.btn.delete}" onclick="deleteUser();"></button>
			</div>
		</div>
	</div>
</div>
<script th:inline="javascript">
	
	function deleteUser() {
		loading();
		
		var usernameLogged = /*[[${#httpServletRequest.remoteUser}]]*/;
		var table = $('#userTable').DataTable();
		
		// Obtenemos la fila seleccionada
		var selectedRow = table.row({ selected: true });
		
		// Si hay alguna fila seleccionada, la deseleccionamos
		if (selectedRow.count() > 0) {
		    table.rows({ selected: true }).deselect();
		}
		
		// Obtenemos los datos de la fila seleccionada
		var rowData = selectedRow.data();
		
		var actionDeleteUser = /*[[@{/deleteuser}]]*/;
		$.ajax(actionDeleteUser,{
        	data:$.param({'id':rowData.idUserValet, 'index':selectedRow.index(), 'remoteUser':usernameLogged}),
            type:'POST',
            success: function(data){
            	// Se oculta la capa 'cargando...'
            	hide();
            	if(data =="-1"){
					var msgErrorLogged =  /*[[#{form.user.delete.logged}]]*/;    		
					$('#messageError').html(msgErrorLogged);
					$('#messageError').addClass('alert alert-danger');
					$("#messageError").fadeTo(5000, 500).slideUp(500, function() {
						$(messageError).slideUp(500);
            	    });
            	}else{
            		table.row(selectedRow.index()).remove().draw();
                	closeModalDeleteUser('modalDeleteUser');		
            	}
            },
            error:function(){}
        });	
	}
	
	//Funcion para cerrar el modal
	function closeModalDeleteUser(modalId){
		$('#' + modalId).modal('hide');
		$('.modal-backdrop').remove();
	}
	
</script>
