<!-- Modal alta ValetServer -->
<div class="modal fade" id="modalAddValetServer" tabindex="-1" role="dialog" aria-labelledby="modalAddValetServerLabel" aria-hidden="true">
	<div class="modal-dialog" role="document">
		<form id="valetServerForm" th:object="${valetServerForm}" th:action="@{/valetServer}" method="post">
			<div class="modal-content">
				<div class="modal-header">
					<h5 class="modal-title" th:text="#{valetServer.modal.addTitle}">Nuevo Servidor</h5>
					<button type="button" class="close" data-dismiss="modal" aria-label="Close">
						<span>&times;</span>
					</button>
				</div>

				<div class="modal-body">
					<input type="hidden" id="idValetServer" th:field="*{idValetServer}"/>

					<!-- Nombre del servidor -->
					<div class="form-group">
						<label for="serverName" th:text="#{valetServer.name}"></label>
						<script th:inline="javascript">
							var messageServerName = /*[[#{valetServer.name.pattern}]]*/ 'default';
						</script>
						<span id="serverName_span" class="badge bgc-red-50 c-red-700 p-10 lh-0 badge-pill"></span>
						<input onblur="validateField(this, messageServerName);" type="text" id="serverName" th:field="*{serverName}" class="form-control" />
					</div>

					<!-- URL del servidor -->
					<div class="form-group">
						<label for="serverUrl" th:text="#{valetServer.url}"></label>
						<script th:inline="javascript">
							var messageServerUrl = /*[[#{valetServer.url.pattern}]]*/ 'default';
						</script>
						<span id="serverUrl_span" class="badge bgc-red-50 c-red-700 p-10 lh-0 badge-pill"></span>
						<input onblur="validateField(this, messageServerUrl);" type="url" id="serverUrl" th:field="*{serverUrl}" class="form-control" />
					</div>

					<!-- Aplicación -->
					<div class="form-group">
						<label for="application" th:text="#{valetServer.app}"></label>
						<script th:inline="javascript">
							var messageApplication = /*[[#{valetServer.app.pattern}]]*/ 'default';
						</script>
						<span id="application_span" class="badge bgc-red-50 c-red-700 p-10 lh-0 badge-pill"></span>
						<input onblur="validateField(this, messageApplication);" type="text" id="application" th:field="*{application}" class="form-control" />
					</div>

					<!-- Versión -->
					<div class="form-group">
					  <label for="version" th:text="#{valetServer.version}"></label>
					  <script th:inline="javascript">
					    var messageVersion = /*[[#{valetServer.version.pattern}]]*/ 'default';
					  </script>
					  <span id="version_span" class="badge bgc-red-50 c-red-700 p-10 lh-0 badge-pill"></span>
					  <select id="version"
					          th:field="*{version}"
					          class="form-control"
					          onblur="validateField(this, messageVersion);">
					    <option value="">--</option>
					    <option value="1.1.0">v.1.1.0</option>
					    <option value="1.2.0">v.1.2.0 o superior</option>
					  </select>
					</div>

					<!-- Timeout -->
					<div class="form-group">
						<label for="connectionTimeout" th:text="#{valetServer.timeout}"></label>
						<script th:inline="javascript">
							var messageTimeout = /*[[#{valetServer.timeout.pattern}]]*/ 'default';
						</script>
						<span id="connectionTimeout_span" class="badge bgc-red-50 c-red-700 p-10 lh-0 badge-pill"></span>
						<input onblur="validateField(this, messageTimeout);" type="number" id="connectionTimeout" th:field="*{connectionTimeout}" class="form-control" />
					</div>

					<!-- Error general -->
					<div id="errorModalAdd" class="alert alert-danger d-none" role="alert"></div>
				</div>

				<div class="modal-footer">
					<button type="button" class="btn btn-secondary" data-dismiss="modal" th:text="#{valetServer.button.cancel}">Cancelar</button>
					<button type="submit" class="btn btn-primary" id="addBtn" th:text="#{valetServer.button.save}">Guardar</button>
				</div>
			</div>
		</form>
	</div>
</div>

<script th:inline="javascript">
  $("#valetServerForm").submit(function (event) {
    event.preventDefault();
    
    // Valida todos los campos antes de enviar el formulario
    if (!validateForm()) {
      return;
    }

    var formData = JSON.stringify($(this).serializeJSON());
    loading();

    $.ajax({
      type: "POST",
      url: /*[[@{/valetServer/update}]]*/,
      data: formData,
      contentType: "application/json",
      dataType: "json",
      success: function () {
        hide();
        $("#modalAddValetServer").modal("hide");
        valetTable.ajax.reload();
        updateServerSelect();
      },
      error: function () {
        hide();
        var msgError = /*[[#{valetServer.form.error}]]*/ 'Error al guardar el servidor.';
        $("#errorModalAdd").removeClass("d-none").text(msgError);
      }
    });
  });

  function validateForm() {
	  var isValid = true;
	  
	  // Todos los campos a validar
	  var fields = [
	    { id: 'serverName',        msg: messageServerName },
	    { id: 'serverUrl',         msg: messageServerUrl    },
	    { id: 'application',       msg: messageApplication  },
	    { id: 'connectionTimeout', msg: messageTimeout      },
	    { id: 'version',           msg: messageVersion      }
	  ];
	  fields.forEach(function(field) {
	    var input = document.getElementById(field.id);
	    validateField(input, field.msg);
	    if (!input.checkValidity()) {
	      isValid = false;
	    }
	  });
	  
	  return isValid;
	}

  function validateField(input, errorMsg) {
	  var $input = $(input);
	  var $span = $("#" + input.id + "_span");
	  var value = $input.val()?.trim();

	  var isValid = true;

	  // Validar si el campo está vacío
	  if (!value) {
	    isValid = false;
	  }

	  // Validación extra según tipo
	  if (isValid && input.type === "number") {
	    isValid = !isNaN(value);
	  }

	  // Mostrar mensaje si no es válido
	  if (!isValid) {
	    $span.text(errorMsg);
	    $span.addClass("badge bgc-red-50 c-red-700 p-10 lh-0 badge-pill");
	  } else {
	    $span.text('');
	    $span.removeClass("badge bgc-red-50 c-red-700 p-10 lh-0 badge-pill");
	  }

	  return isValid;
	}
</script>
